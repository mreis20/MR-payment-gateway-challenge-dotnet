version: "3.8"

services:
  bank_simulator:
    container_name: bank_simulator
    image: bbyars/mountebank:2.8.1
    ports:
      - "2525:2525"
      - "8080:8080"
    command: --configfile /imposters/bank_simulator.ejs --allowInjection
    volumes:
      - type: bind
        source: ./imposters
        target: /imposters
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "const socket = require('net').connect(8080, '127.0.0.1'); socket.on('connect', () => { socket.end(); process.exit(0); }); socket.on('error', () => process.exit(1));"
      interval: 2s
      timeout: 3s
      retries: 15
      start_period: 5s

  api:
    profiles: [app]
    build: .
    ports:
      - "127.0.0.1:${API_PORT:-8081}:8080"
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      Bank__BaseUrl: http://bank_simulator:8080/
      HttpsRedirection__Enabled: "false"
    depends_on:
      bank_simulator:
        condition: service_healthy
